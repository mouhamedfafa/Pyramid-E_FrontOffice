<div class="page">
  <div class="ph">
    <div class="ph-icon"><i class="ti ti-building"></i></div>
    <div class="ph-info">
      <div class="ph-title">Directions & organisation<span *ngIf="entrepriseNom"> — {{ entrepriseNom }}</span></div>
      <div class="ph-sub">Direction → Département → Équipe. Le responsable de chaque entité est le N+1 automatique de ses membres.</div>
    </div>
    <div class="ph-acts">
      <app-selecteur-entreprise (changement)="choisirEntreprise($event)"></app-selecteur-entreprise>
      <app-import-export-organisation *ngIf="entrepriseId"
        [entrepriseId]="entrepriseId"
        [entrepriseNom]="entrepriseNom"
        (changement)="rafraichirStructure = rafraichirStructure + 1; rafraichirAnomalies = rafraichirAnomalies + 1">
      </app-import-export-organisation>
      <button type="button" class="btn-o" (click)="anomaliesVisibles = !anomaliesVisibles" [attr.aria-expanded]="anomaliesVisibles">
        <i class="ti ti-alert-triangle"></i> Contrôle
      </button>
      <a class="btn-o" [routerLink]="routes.adminrhOrganigramme"><i class="ti ti-sitemap"></i> Organigramme</a>
    </div>
  </div>

  <div class="contenu" *ngIf="entrepriseId">
    <app-anomalies-organisation *ngIf="anomaliesVisibles" class="bloc"
      [entrepriseId]="entrepriseId"
      [rafraichir]="rafraichirAnomalies"
      (entiteSelectionnee)="ouvrirEntite($event)">
    </app-anomalies-organisation>

    <app-structure-organisation
      [entrepriseId]="entrepriseId"
      [entiteAOuvrir]="entiteAOuvrir"
      [rafraichir]="rafraichirStructure"
      (changement)="rafraichirAnomalies = rafraichirAnomalies + 1">
    </app-structure-organisation>
  </div>
</div>
